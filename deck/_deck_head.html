<!-- Fonts ship with this repo; an absolute path works on one machine only. -->
<style>
@font-face { font-family:'Inter'; font-weight:400; src:url('../assets/fonts/Inter-Regular.ttf'); }
@font-face { font-family:'Inter'; font-weight:500; src:url('../assets/fonts/Inter-Medium.ttf'); }
@font-face { font-family:'Inter'; font-weight:600; src:url('../assets/fonts/Inter-SemiBold.ttf'); }
@font-face { font-family:'Inter'; font-weight:700; src:url('../assets/fonts/Inter-Bold.ttf'); }
@font-face { font-family:'Inter'; font-weight:800; src:url('../assets/fonts/Inter-ExtraBold.ttf'); }
@font-face { font-family:'JetBrains Mono'; font-weight:400; src:url('../assets/fonts/JetBrainsMono-Regular.ttf'); }
@font-face { font-family:'JetBrains Mono'; font-weight:500; src:url('../assets/fonts/JetBrainsMono-Medium.ttf'); }
</style>

<link rel="stylesheet" href="../assets/pdf/brand.css">

<style>
/* ---------- the slide frame ---------- */
body { background:#000; margin:0; }

.slide {
    position: relative;
    width: 1280px; height: 720px;
    padding: 56px 72px 48px;
    background: var(--base);
    display: flex; flex-direction: column;
    overflow: hidden;
    margin: 0 auto 24px;
}

.slide h1 { font-size: 64px; line-height: 1.03; letter-spacing: -0.035em; color: var(--tx-1); }
.slide h2 { font-size: 37px; line-height: 1.1;  letter-spacing: -0.028em; color: var(--tx-1); }
.slide h3 { font-size: 16.5px; line-height: 1.3;  letter-spacing: -0.012em; color: var(--tx-1); font-weight: 650; }
.slide p  { font-size: 16px; line-height: 1.48; max-width: 1000px; color: var(--tx-2); }
.slide p + p { margin-top: 12px; }

.eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--green); margin-bottom: 18px;
}

.slide p.lede { font-size: 25px; line-height: 1.36; color: var(--tx-1); max-width: 960px; letter-spacing: -0.015em; }

/* ---------- cards ---------- */
.grid { display: grid; gap: 13px; margin-top: 24px; }
.grid.two   { grid-template-columns: repeat(2, 1fr); }
.grid.three { grid-template-columns: repeat(3, 1fr); }

.card {
    padding: 20px 22px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--surf-1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.card p { font-size: 13.5px; line-height: 1.42; margin-top: 6px; }
.card .n {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    color: var(--tx-3); display: block; margin-bottom: 8px;
}
.card.accent { border-color: rgba(10,199,110,0.28); }
.card.amber  { border-color: rgba(245,176,69,0.30); }

/* ---------- the guard strip on slide 3 ---------- */
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
.flow .step { padding: 18px 20px; border-radius: var(--radius-card); border: 1px solid var(--line); background: var(--surf-1); }
.flow .step .i { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--warn); display: block; margin-bottom: 8px; }
.flow .step h3 { font-size: 15px; }
.flow .step p { font-size: 13px; margin-top: 6px; line-height: 1.4; }

/* ---------- proof table (slide 6) ---------- */
table.proof { width: 100%; margin-top: 22px; border-collapse: collapse; }
table.proof td { font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.proof td:first-child { color: var(--tx-1); }
table.proof td:nth-child(2) { font-family: var(--mono); text-align: right; width: 90px; color: var(--tx-2); }
table.proof td:last-child { font-family: var(--mono); text-align: right; width: 80px; font-weight: 600; }
table.proof tr.pass td:last-child { color: var(--green-lift); }
table.proof tr.fail td:last-child { color: var(--warn); }

/* ---------- stat row ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
.stat { padding: 18px 20px; border-radius: var(--radius-card); border: 1px solid var(--line); background: var(--surf-1); }
.stat .v { font-family: var(--mono); font-size: 28px; font-weight: 500; color: var(--green-lift); letter-spacing: -0.02em; }
.stat .k { font-size: 12.5px; color: var(--tx-2); margin-top: 6px; line-height: 1.32; }

/* ---------- the closing list ---------- */
.states { display: grid; gap: 10px; margin-top: 20px; max-width: none; }
.states li::before { content: none; }
.states li {
    list-style: none; padding: 14px 20px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--line-2); background: var(--surf-2);
    font-size: 16px; color: var(--tx-1); font-weight: 600;
}
.states li span { display: block; font-size: 13.5px; font-weight: 400; color: var(--tx-2); margin-top: 5px; }
.states li.amber { border-color: rgba(245,176,69,0.35); }

/* ---------- cover mark and footer ---------- */
.mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--green); color: var(--on-green);
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    margin-bottom: 28px;
}

.foot {
    position: absolute; left: 72px; right: 72px; bottom: 26px;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 13px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--tx-3);
}

.body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

.contact { margin-top: 24px; font-family: var(--mono); font-size: 15px; color: var(--tx-2); line-height: 1.9; }
.contact strong { display: block; font-family: var(--font); font-size: 17px; color: var(--tx-1); margin-bottom: 6px; }
.contact a { color: var(--green-lift); }

@page { size: 1280px 720px; margin: 0; }

@media print {
    .slide { margin: 0; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
}
</style>
</head>
